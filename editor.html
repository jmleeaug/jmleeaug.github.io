<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVE 일정 편집</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>body{padding:0 20px}main{margin:0 auto;max-width:850px;padding:35px 24px}label{display:block;margin:16px 0}input,textarea,button{font:inherit;padding:10px;border:1px solid #b8b8b8;background:#ffffff;color:#171717}input,textarea{display:block;width:100%}button{cursor:pointer;margin:8px 6px 8px 0}article{border-top:1px solid #b8b8b8;padding:14px 0}#status{white-space:pre-wrap}@media(max-width:760px){body{padding:0}main{padding:24px 20px}input,textarea{font-size:16px}button{min-height:44px}label{margin:20px 0}}</style><main><h2>LIVE 일정 편집</h2><p>입력 → 일정에 추가 → 파일 저장 → GitHub에 업로드.<br>이 화면은 직접 게시하지 않습니다. 저장 전에는 창을 닫지 마세요.</p><p><a href="index.html#live">사이트 보기 ↗</a></p><label>기존 일정 파일 불러오기 (schedule-data.js)<input type="file" id="import" accept=".js"></label><form id="form"><label>묶음 제목 (선택: 2026, ARCHIVE 등)<input name="sectionTitle" maxlength="100"></label><label>공연명 *<input name="title" required maxlength="200"></label><label>공연 날짜 * (현지 날짜)<input type="date" name="date" required></label><label>마지막 공연 날짜 (여러 날일 때)<input type="date" name="endDate"></label><label>시간·시간대 (예: 19:30 KST)<input name="time" maxlength="100"></label><label>장소 *<input name="venue" required maxlength="300"></label><label>예매 링크 (https://)<input name="ticket" type="url" pattern="https://.*"></label><label>추가 안내<textarea name="note" maxlength="1000"></textarea></label><button type="submit">일정에 추가</button></form><h3>저장할 일정</h3><div id="list"></div><button id="save">schedule-data.js 저장</button><p role="status" id="status"></p><p class="note">편집 화면에 로그인·게시 권한은 없습니다. GitHub 로그인 후 파일 업로드가 필요합니다. 공개해도 되는 자료만 입력하세요. 날짜에 따른 자동 분류는 하지 않습니다. 묶음 제목에 2026, ARCHIVE 등을 직접 입력하세요. 같은 제목의 일정을 붙여 두면 제목이 한 번만 표시됩니다. 위로·아래로 버튼으로 표시 순서를 정할 수 있습니다.</p></main><script src="schedule-data.js"></script><script>
let rows=structuredClone(window.SCHEDULE_DATA?.events||[]);const $=id=>document.getElementById(id);function show(){ $('list').replaceChildren();rows.forEach((e,i)=>{const a=document.createElement('article');const t=document.createElement('p');t.textContent=(e.sectionTitle?'['+e.sectionTitle+'] ':'')+e.date+' · '+e.title+' · '+e.venue;const b=document.createElement('button');b.textContent='수정';b.onclick=()=>{if(!confirm('이 항목을 입력칸으로 옮깁니다. 수정 후 다시 추가하세요.'))return;for(const key of ['sectionTitle','title','date','endDate','time','venue','ticket','note'])$('form').elements[key].value=e[key]||'';rows.splice(i,1);show();$('form').scrollIntoView()};const d=document.createElement('button');d.textContent='삭제';d.onclick=()=>{if(confirm('이 일정을 삭제할까요?')){rows.splice(i,1);show()}};const up=document.createElement('button');up.textContent='위로';up.disabled=i===0;up.onclick=()=>{[rows[i-1],rows[i]]=[rows[i],rows[i-1]];show()};const down=document.createElement('button');down.textContent='아래로';down.disabled=i===rows.length-1;down.onclick=()=>{[rows[i+1],rows[i]]=[rows[i],rows[i+1]];show()};a.append(t,b,d,up,down);$('list').append(a)});if(!rows.length)$('list').textContent='등록된 일정이 없습니다.'}show();$('form').onsubmit=async ev=>{ev.preventDefault();try{const e=Object.fromEntries(new FormData(ev.target));delete e.poster;if(e.endDate&&e.endDate<e.date)throw Error('마지막 날짜를 확인하세요.');rows.push(e);ev.target.reset();show();$('status').textContent='추가했습니다. 아래 저장 버튼으로 파일을 내려받으세요.'}catch(e){$('status').textContent=e.message}};
$('save').onclick=()=>{const blob=new Blob(['window.SCHEDULE_DATA = '+JSON.stringify({events:rows},null,2)+';\n'],{type:'text/javascript'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='schedule-data.js';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$('status').textContent='저장한 파일 이름이 schedule-data.js인지 확인하고 GitHub 저장소 최상위에 업로드하세요. (1) 등이 붙으면 이름을 고치세요.'};$('import').onchange=async ev=>{try{const f=ev.target.files[0];if(!f)return;const text=await f.text();const match=text.match(/^\s*window\.SCHEDULE_DATA\s*=\s*([\s\S]*?)\s*;?\s*$/);if(!match)throw Error('일정 파일 형식이 다릅니다.');const data=JSON.parse(match[1].replace(/;\s*$/,''));if(!Array.isArray(data.events))throw Error('일정 목록이 없습니다.');if(!confirm('현재 편집 목록을 이 파일로 바꿀까요?'))return;rows=data.events;show();$('status').textContent='불러왔습니다.'}catch(e){$('status').textContent=e.message}};
</script></html>
